name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure npm registry for Midnight packages
        run: |
          echo "@midnight-ntwrk:registry=https://registry.npmjs.org/" >> .npmrc
          cat .npmrc || true

      - name: Install contract dependencies
        working-directory: contract
        run: npm install --legacy-peer-deps

      - name: Run contract tests (simulator — no network required)
        working-directory: contract
        run: npx vitest run --reporter=verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: contract/test-results.xml
          if-no-files-found: ignore
